# Plain static site: no build step, publish this folder as-is.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

# Always fetch the newest seating (so day-of changes show up right away)
[[headers]]
  for = "/guests.csv"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "text/csv; charset=utf-8"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
